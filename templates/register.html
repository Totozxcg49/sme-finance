{% extends "base.html" %}

{% block title %}สมัครสมาชิกสร้างบัญชีธุรกิจ - SME Financial Management System{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 220px); display: flex; align-items: center; justify-content: center; padding: 1rem 0;">
    <div class="card" style="width: 100%; max-width: 460px; margin: 0 auto; padding: 2rem 1.75rem; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SME Finance Logo" class="auth-logo-img">
            <h1 style="font-size: 1.45rem; font-weight: 700; color: var(--dark-900);">เริ่มต้นใช้งานฟรี</h1>
            <p style="font-size: 0.875rem; color: var(--muted); margin-top: 0.25rem;">สร้างบัญชีบริหารจัดการการเงินสำหรับธุรกิจ SME ของคุณ</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="business_name">ชื่อธุรกิจ / ร้านค้าของคุณ *</label>
                <input type="text" id="business_name" name="business_name" placeholder="เช่น ร้านกาแฟคราฟต์, สมชายค้าส่ง" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username">ชื่อผู้ใช้งาน (Username) *</label>
                <input type="text" id="username" name="username" placeholder="ความยาวอย่างน้อย 3 ตัวอักษร" required>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="password">รหัสผ่าน (Password) *</label>
                <input type="password" id="password" name="password" placeholder="ความยาวอย่างน้อย 4 ตัวอักษร" required style="width: 100%; min-height: 46px; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 16px; font-family: var(--font-thai); outline: none;">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="confirm_password">ยืนยันรหัสผ่านอีกครั้ง *</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="กรอกรหัสผ่านซ้ำอีกครั้ง" required style="width: 100%; min-height: 46px; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 16px; font-family: var(--font-thai); outline: none;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; box-shadow: var(--shadow-primary);">
                ✨ สร้างบัญชีและเข้าสู่ระบบ
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center;">
            <p style="font-size: 0.9rem; color: var(--muted);">
                มีบัญชีอยู่แล้ว? 
                <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">เข้าสู่ระบบที่นี่</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
